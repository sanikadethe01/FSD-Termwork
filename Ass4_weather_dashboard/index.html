<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="header-content">
    <i class="fas fa-cloud-sun"></i>
    <h1>Weather Dashboard</h1>
  </div>
</header>

<div class="container">

  <!-- Current Weather Stats -->
  <div class="card">
    <div class="card-header">
      <h3><i class="fas fa-thermometer-half"></i> Current Conditions</h3>
    </div>
    <div class="stats">
      <div class="stat-box">
        <div class="stat-icon"><i class="fas fa-temperature-high"></i></div>
        <div class="stat-label">Temperature</div>
        <div class="stat-value" id="tempValue">22°C</div>
      </div>
      <div class="stat-box">
        <div class="stat-icon"><i class="fas fa-droplet"></i></div>
        <div class="stat-label">Humidity</div>
        <div class="stat-value" id="humidityValue">65%</div>
      </div>
      <div class="stat-box">
        <div class="stat-icon"><i class="fas fa-wind"></i></div>
        <div class="stat-label">Wind Speed</div>
        <div class="stat-value" id="windValue">12 km/h</div>
      </div>
      <div class="stat-box">
        <div class="stat-icon"><i class="fas fa-gauge"></i></div>
        <div class="stat-label">Pressure</div>
        <div class="stat-value" id="pressureValue">1013 mb</div>
      </div>
    </div>
  </div>

  <!-- Temperature Trend -->
  <div class="card">
    <div class="card-header">
      <h3><i class="fas fa-chart-line"></i> Temperature Trend (7 Days)</h3>
    </div>
    <div class="chart-container">
      <canvas id="tempChart"></canvas>
    </div>
  </div>

  <!-- Humidity & Precipitation -->
  <div class="card">
    <div class="card-header">
      <h3><i class="fas fa-chart-bar"></i> Humidity vs Precipitation</h3>
    </div>
    <div class="chart-container">
      <canvas id="humidityChart"></canvas>
    </div>
  </div>

  <!-- Wind Speed Distribution -->
  <div class="card">
    <div class="card-header">
      <h3><i class="fas fa-fan"></i> Wind Speed Distribution</h3>
    </div>
    <div class="chart-container">
      <canvas id="windChart"></canvas>
    </div>
  </div>

</div>

<div class="button-container">
  <button class="refresh-btn" onclick="updateData()">
    <i class="fas fa-sync-alt"></i> Refresh Data
  </button>
</div>

<footer class="location">
  <i class="fas fa-map-marker-alt"></i> New York, USA <span class="divider">|</span> Last updated: <span id="timestamp">Just now</span>
</footer>

<script src="script.js"></script>

</body>
</html>
