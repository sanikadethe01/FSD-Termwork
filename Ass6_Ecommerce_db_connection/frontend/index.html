<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FashionStore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CDN CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg amazon-nav">
    <div class="container-fluid">

        <a class="navbar-brand text-white fw-bold" href="#">FashionStore</a>

        <form class="d-flex w-50 mx-auto">
            <input class="form-control" type="search" placeholder="Search products..." id="searchInput">
        </form>

        <div>
            <a href="cart.html" class="text-white text-decoration-none fw-semibold">
                🛒 Cart (<span id="cartCount">0</span>)
            </a>
        </div>

    </div>
</nav>

<!-- ================= HERO CAROUSEL ================= -->
<div id="mainCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">

    <div class="carousel-inner">

        <div class="carousel-item active">
            <div class="hero-slide slide1">
                <div class="hero-content">
                    <h1>Big Fashion Sale</h1>
                    <p>Up to 60% OFF on Trending Styles</p>
                    <button class="btn btn-warning btn-lg" onclick="scrollToProducts()">Shop Now</button>
                </div>
            </div>
        </div>

        <div class="carousel-item">
            <div class="hero-slide slide2">
                <div class="hero-content">
                    <h1>New Arrivals 2026</h1>
                    <p>Exclusive Collection Just Launched</p>
                    <button class="btn btn-light btn-lg" onclick="scrollToProducts()">Explore</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Controls -->
    <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>

<!-- ================= CATEGORY BAR ================= -->
<div class="category-bar text-center py-3">
    <button class="btn btn-outline-dark m-1" onclick="filterProducts('All')">All</button>
    <button class="btn btn-outline-dark m-1" onclick="filterProducts('Men')">Men</button>
    <button class="btn btn-outline-dark m-1" onclick="filterProducts('Women')">Women</button>
    <button class="btn btn-outline-dark m-1" onclick="filterProducts('Children')">Children</button>
</div>

<!-- ================= PRODUCT SECTION ================= -->
<div class="container my-5">
    <div class="row" id="productList"></div>
</div>

<!-- ================= FOOTER ================= -->
<footer class="amazon-footer text-center text-white py-3">
    © 2026 FashionStore | Designed by SANIKA
</footer>

<!-- Bootstrap JS (REQUIRED for Carousel) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="script.js"></script>

</body>
</html>
