<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar amazon-nav">
    <div class="container-fluid">
        <a class="navbar-brand text-white fw-bold" href="index.html">🔙 Home</a>
        <span class="text-white">Shopping Cart</span>
    </div>
</nav>

<div class="container my-5">
    <h3 class="mb-4">Your Shopping Cart</h3>
    <div id="cartItems">
        <!-- Cart items will be displayed here -->
    </div>
    <div class="row mt-4">
        <div class="col-md-8"></div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Order Summary</h5>
                    <p class="card-text">Total: ₹<span id="cartTotal">0</span></p>
                    <button class="btn btn-success w-100" id="checkoutBtn" onclick="checkout()">Proceed to Checkout</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
